services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: agentflow
      MYSQL_USER: agentflow
      MYSQL_PASSWORD: agentflow
      MYSQL_DATABASE: agentflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  # ── 可观测性：Prometheus + Grafana + OTel Collector ──

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yaml

  # ── 应用服务 ──

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.example
    environment:
      JWT_SECRET: ${JWT_SECRET:-agentflow-production-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-agentflow-production-enc-key-change-me!!}
      STRICT_JWT: "false"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: agentflow-api
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      PROM_ENABLED: "true"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    ports:
      - "18000:8000"
    depends_on:
      - mysql
      - redis
      - milvus
      - otel-collector

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env.example
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: agentflow-worker
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      LOG_FORMAT: json
    depends_on:
      - redis
      - mysql

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env.example
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
    ports:
      - "13000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data:
