[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "apps/worker/tests", "packages/runtime/tests", "packages/workflow/tests"]
pythonpath = [".", "apps/api", "apps/worker", "packages/runtime", "packages/workflow"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

