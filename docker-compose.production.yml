services:
  mysql:
    restart: unless-stopped
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the external env file}
      MYSQL_USER: ${MYSQL_USER:-agentflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the external env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentflow}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the external env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the external env file}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the external env file}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the external env file}

  milvus:
    restart: unless-stopped
    ports: !reset []
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the external env file}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the external env file}

  prometheus:
    restart: unless-stopped
    ports: !reset []

  grafana:
    restart: unless-stopped
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in the external env file}
      GF_USERS_ALLOW_SIGN_UP: "false"

  otel-collector:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    ports: !reset []
    env_file: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-agentflow}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the external env file}@mysql:3306/${MYSQL_DATABASE:-agentflow}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the external env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the external env file}
      STRICT_JWT: "true"
      AGENTFLOW_VECTOR_BACKEND: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      AGENTFLOW_EMBEDDING_PROVIDER: ${AGENTFLOW_EMBEDDING_PROVIDER:-local-hash}
      AGENTFLOW_EMBEDDING_BASE_URL: ${AGENTFLOW_EMBEDDING_BASE_URL:-}
      AGENTFLOW_EMBEDDING_API_KEY: ${AGENTFLOW_EMBEDDING_API_KEY:-}
      AGENTFLOW_EMBEDDING_MODEL: ${AGENTFLOW_EMBEDDING_MODEL:-local-hash-embedding-v1}
      AGENTFLOW_EMBEDDING_DIMENSION: ${AGENTFLOW_EMBEDDING_DIMENSION:-256}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-agentflow_knowledge_chunks}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    env_file: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-agentflow}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the external env file}@mysql:3306/${MYSQL_DATABASE:-agentflow}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app:/app/apps/api:/app/apps/worker:/app/packages/runtime:/app/packages/workflow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    restart: unless-stopped
    ports: !reset []
    env_file: !reset []
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DEPLOY_USER: ${DEPLOY_USER:?Set DEPLOY_USER in the external env file}
      DEPLOY_PASSWORD_HASH: ${DEPLOY_PASSWORD_HASH:?Set DEPLOY_PASSWORD_HASH in the external env file}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
